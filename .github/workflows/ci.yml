name: CI & Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev/security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run automated pytest suite (strict warnings-as-errors)
        run: pytest -v -W error

      - name: Static lint check (Ruff)
        run: ruff check src tests

      - name: Static security analysis (Bandit)
        run: bandit -r src

  reuse-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify FSFE REUSE 3.3 SPDX licensing compliance
        run: |
          python -m pip install --upgrade pip
          pip install "reuse[charset-normalizer]"
          reuse lint
